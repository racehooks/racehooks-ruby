name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby-version: ["2.7", "3.0", "3.1", "3.2", "3.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Syntax check
        run: for f in lib/racehooks.rb lib/racehooks/*.rb spec/*.rb; do ruby -c "$f"; done
      - name: Run tests
        run: bundle exec rake test
      - name: Build gem
        run: gem build racehooks.gemspec
