name: Release

# Fully automated release on every push to main. semantic-release reads the
# conventional-commit messages since the last release, decides the version bump,
# writes it into lib/racehooks/version.rb, commits it back, tags, cuts a GitHub
# release, then builds and pushes the gem to RubyGems via Trusted Publishing
# (OIDC) — no API key. Commits with no releasable changes publish nothing.
#
# The RubyGems gem must trust this repo + publish.yml + the "rubygems" environment
# (rubygems.org → gem → Trusted Publishing; a pending publisher works before the
# first push). Requires id-token: write.

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: write # semantic-release: commit version bump + create tag/release
      id-token: write # RubyGems Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # semantic-release needs full history + tags
          persist-credentials: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # semantic-release v25 requires Node >= 22.14

      # OIDC token exchange -> short-lived RubyGems API key for `gem push`.
      - name: Configure RubyGems credentials (OIDC trusted publishing)
        uses: rubygems/configure-rubygems-credentials@main

      - name: Install semantic-release
        run: npm install -g semantic-release @semantic-release/exec @semantic-release/git

      - name: Semantic Release
        run: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
