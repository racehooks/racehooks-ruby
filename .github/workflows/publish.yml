name: Publish to RubyGems

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: write # release-gem pushes the version tag
      id-token: write # required for RubyGems trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Trusted publishing: no API key. Configure the trusted publisher for this
      # repo/workflow at https://rubygems.org (Gems → RubyGems → Trusted Publishing)
      # before the first release. Runs `bundle exec rake release`.
      - uses: rubygems/release-gem@v1
